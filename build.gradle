plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = mod_version
group = maven_group

base {
    archivesName = "1MB-WaterSource-v${mod_version}-${build_number}"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "watersourcemod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Mod Menu is an optional runtime integration, so the core mod does not require it.
    clientCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    clientRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "build_number", build_number

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "build_number": build_number
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named("jar") {
    archiveVersion = ""
    archiveClassifier = ""
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            artifactId = "watersourcemod"
        }
    }
}
